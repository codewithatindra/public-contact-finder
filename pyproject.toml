[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "public-contact-finder"
version = "0.2.0"
description = "Local parser for email addresses published in supplied public profile text or HTML"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Atindra Mishra"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Text Processing",
]

[project.scripts]
public-contact-finder = "contact_finder.__main__:main"

[tool.setuptools.packages.find]
include = ["contact_finder*"]
